name: tests

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime with optional MCP host dependencies
        run: python -m pip install -e ".[mcp-host]"
      - name: Run full unittest suite
        run: python -m unittest discover -s tests -p "test*.py"
