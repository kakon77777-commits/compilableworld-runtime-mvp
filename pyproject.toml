[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compilableworld-runtime"
version = "0.1.2"
description = "A dependency-free reference MVP for the MSSP modular CompilableWorld runtime with optional governed AMK capture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
mcp-host = ["mcp>=1.27,<2", "uvicorn>=0.30"]

[project.scripts]
cw-runtime = "compilableworld.cli:main"
amk-local = "agent_memory_kernel.cli:main"
cw-mcp-readonly = "compilableworld_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
