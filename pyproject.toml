[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compilableworld-runtime"
version = "0.1.0"
description = "A non-web reference MVP for the MSSP modular CompilableWorld runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cw-runtime = "compilableworld.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

